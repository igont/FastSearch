[package]
name = "fastsearch"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastsearch"
path = "src/main.rs"

[dependencies]
tantivy = "=0.26.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"
ignore = "=0.4.33"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-python = "=0.25.0"
fastembed = { version = "=5.17.4", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls", "qwen3", "nomic-v2-moe", "directml"] }
candle-core = "=0.11.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
fs2 = "=0.4.3"
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq", "native-tls"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "native-tls"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.8"
terminal-dialogue = { path = "../terminal-dialogue" }
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
