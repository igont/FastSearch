[package]
name = "fastsearch"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastsearch"
path = "src/main.rs"

[dependencies]
tantivy = "=0.26.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"
ignore = "=0.4.33"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-python = "=0.25.0"
fastembed = { version = "=5.17.4", default-features = false, features = ["ort-download-binaries-native-tls"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
